<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pocket Scraper Secure</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="dashboard">
  <h1>Pocket Scraper Secure</h1>
  <p class="small" id="host"></p>

  <section class="card" id="vault"></section>
  <div id="message" class="message" role="status"></div>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-recipes" aria-controls="panel-recipes">Recipes</button>
    <button role="tab" id="tab-records" aria-controls="panel-records">Records</button>
    <button role="tab" id="tab-runners" aria-controls="panel-runners">Runners</button>
    <button role="tab" id="tab-settings" aria-controls="panel-settings">Settings</button>
  </nav>

  <section id="panel-recipes" role="tabpanel" aria-labelledby="tab-recipes">
    <div class="scroll"><table id="recipes"></table></div>
    <h2>Recent runs</h2>
    <div class="scroll"><table id="runs"></table></div>
  </section>

  <section id="panel-records" role="tabpanel" aria-labelledby="tab-records" hidden>
    <div class="toolbar"><select id="recordsRecipe" aria-label="Recipe"></select><h2 id="recordsTitle" class="visually-hidden">Records</h2></div>
    <div id="records"></div>
  </section>

  <section id="panel-runners" role="tabpanel" aria-labelledby="tab-runners" hidden>
    <p class="small">Runners run recipes on their own schedule, with no browser window: on a VM, a server or this computer. They only accept recipes signed by this vault. Their results come back sealed and signed. See docs/RUNNER.md.</p>
    <div id="runners"></div>
    <h2>Import results</h2>
    <label class="dropzone" id="dropzone" for="importBatches"><strong>Drop .pssbatch files here</strong> or click to choose them<input id="importBatches" class="visually-hidden" type="file" multiple accept=".pssbatch"></label>
    <div class="actions"><button id="collect" hidden>Collect from bucket</button><button id="retryDeferred" hidden title="Results set aside because their runner wasn't approved yet or their recipe was missing">Retry set-aside</button></div>
    <div id="importMessage" class="message" role="status"></div>
  </section>

  <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
    <h2>Vault</h2>
    <div id="vaultSettings"></div>
    <h2>Timing</h2>
    <div id="runSettings" class="settings-grid"></div>
    <div id="runSettingsSave"></div>
    <h2>Claude</h2>
    <section class="card" id="claude"></section>
  </section>

  <script src="dashboard.js" type="module"></script>
</body>
</html>
