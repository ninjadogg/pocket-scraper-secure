<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pocket Scraper Secure</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="dashboard">
  <h1>Pocket Scraper Secure</h1>
  <p class="small" id="host"></p>

  <section class="card" id="vault"></section>
  <section class="card" id="claude"></section>
  <div id="message" class="message" role="status"></div>

  <h2>Recipes</h2>
  <div class="scroll"><table id="recipes"></table></div>

  <h2>Runners</h2>
  <p class="small">Runners run recipes on their own schedule: on a VM, a server or this computer, with no browser window. They receive only recipes signed by this vault and its public key; results come back sealed and signed.</p>
  <div id="runners"></div>
  <div class="row"><label class="tight" for="importBatches">Import results</label><input id="importBatches" type="file" multiple accept=".pssbatch"><button id="collect" class="tight" hidden>Collect from bucket</button><button id="retryDeferred" class="tight" hidden title="Results set aside because their runner wasn't enrolled or their recipe was missing">Retry set-aside</button></div>
  <div id="importMessage" class="message" role="status"></div>

  <h2 id="recordsTitle">Records</h2>
  <div id="records"></div>

  <h2>Recent runs</h2>
  <div class="scroll"><table id="runs"></table></div>

  <script src="dashboard.js" type="module"></script>
</body>
</html>
