[package]
name = "pocket-scraper-core"
description = "Validation, records, run planning and encryption shared by the extension (WASM) and the native host."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
hkdf = "0.13.0"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }
getrandom = "0.4.3"
base64 = "0.23.1"
