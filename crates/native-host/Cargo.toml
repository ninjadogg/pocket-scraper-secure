[package]
name = "pocket-scraper-host"
description = "Native messaging host: runs recipes in a private headless browser over a pipe."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Not the workspace lints: handing Chrome its debugging pipe needs one dup2 in
# pre_exec. unsafe is denied everywhere else in this crate.
[lints.rust]
unsafe_code = "deny"

[dependencies]
pocket-scraper-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
base64 = "0.23.1"
hmac = "0.13.0"
zeroize = "1.9.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation"] }
